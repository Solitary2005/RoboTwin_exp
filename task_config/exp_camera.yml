# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 0.02
  random_head_camera_dis: 0.5
  random_table_height: 0.03
  random_light: false
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true

  enable_head_camera_random: true
  head_cam_distance_scale_range: [0.85, 1.0]

  head_cam_azimuth_deg: 10
  head_cam_elevation_deg: 10
  head_cam_distance_ratio: 0.0

  head_cam_yaw_deg: 5
  head_cam_pitch_deg: 5
  head_cam_roll_deg: 5

data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
